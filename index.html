<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reading Zone</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f5f5f5;
  color:#333;
}

header{
  background:#4CAF50;
  color:white;
  padding:10px;
  text-align:center;
}

header p{
  font-size:12px;
}

input{
  padding:8px;
  margin:10px;
  width:90%;
}

#bookList{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.book{
  width:140px;
  margin:10px;
  padding:10px;
  background:white;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.book:hover{
  transform:scale(1.05);
}

.book img{
  width:100%;
  border-radius:8px;
}

button{
  padding:8px;
  margin:5px;
  border:none;
  border-radius:5px;
  background:#4CAF50;
  color:white;
}

button:hover{
  background:#45a049;
}

#reader{
  display:none;
  padding:10px;
}

#content{
  height:75vh;
  overflow-y:auto;
}

.dark{
  background:#121212;
  color:white;
}

.dark .book{
  background:#1e1e1e;
}
</style>
</head>

<body>

<header>
  <h2>📚 My Reading Zone</h2>
  <p>Your Personal Library</p>
  <button onclick="toggleDark()">🌙 Dark Mode</button>
</header>

<input id="search" placeholder="Search books..." onkeyup="searchBooks()">

<div id="bookList"></div>

<div id="reader">
  <button onclick="goBack()">⬅ Back</button>
  <button onclick="saveBookmark()">🔖 Bookmark</button>
  <h2 id="title"></h2>
  <div id="content"></div>
</div>

<script>

// 📚 YOUR BOOKS (GitHub files के हिसाब से)
let books=[
  {
    title:"October Junction",
    cover:"Octoberjunction.jpg",
    pdf:"OctoberJunction.pdf"
  },
  {
    title:"Deewar Mein Khidki",
    cover:"deewarmeekkhidki.jpg",
    pdf:"deewarmeekkhidki.pdf"
  },
  {
    title:"Godaan",
    cover:"godaan.jpg",
    pdf:"godaan.pdf"
  }
];

// 📚 SHOW BOOKS
function displayBooks(list=books){
  let container=document.getElementById("bookList");
  container.innerHTML="";

  list.forEach((b,i)=>{
    container.innerHTML+=`
      <div class="book" onclick="openBook(${i})">
        <img src="${b.cover}">
        <p>${b.title}</p>
      </div>
    `;
  });
}
displayBooks();

// 📖 OPEN PDF BOOK
function openBook(i){
  let book=books[i];
  let content=document.getElementById("content");

  document.getElementById("title").innerText=book.title;
  content.innerHTML="Loading...";

  pdfjsLib.getDocument(book.pdf).promise.then(function(pdf){
    content.innerHTML="";

    for(let p=1;p<=pdf.numPages;p++){
      pdf.getPage(p).then(function(page){
        let viewport=page.getViewport({scale:1.2});
        let canvas=document.createElement("canvas");
        let ctx=canvas.getContext("2d");

        canvas.height=viewport.height;
        canvas.width=viewport.width;

        content.appendChild(canvas);

        page.render({
          canvasContext:ctx,
          viewport:viewport
        });
      });
    }
  });

  document.getElementById("reader").style.display="block";
  document.getElementById("bookList").style.display="none";
}

// 🔙 BACK
function goBack(){
  document.getElementById("reader").style.display="none";
  document.getElementById("bookList").style.display="flex";
}

// 🔍 SEARCH
function searchBooks(){
  let val=document.getElementById("search").value.toLowerCase();
  let filtered=books.filter(b=>b.title.toLowerCase().includes(val));
  displayBooks(filtered);
}

// 🌙 DARK MODE
function toggleDark(){
  document.body.classList.toggle("dark");
}

// 🔖 BOOKMARK
function saveBookmark(){
  let pos=document.getElementById("content").scrollTop;
  let title=document.getElementById("title").innerText;

  let index=books.findIndex(b=>b.title===title);
  localStorage.setItem("bookmark_"+index,pos);

  alert("Bookmark saved!");
}

</script>

</body>
</html>
