<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reading Zone</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5;}
header{background:#4CAF50;color:#fff;padding:10px;text-align:center;}

#bookList{display:flex;flex-wrap:wrap;justify-content:center;}

.book{
width:140px;
margin:10px;
background:#fff;
padding:10px;
border-radius:10px;
text-align:center;
}

.book img{width:100%;}

#reader{display:none;}
#content{height:80vh;overflow:auto;}

canvas{
width:100%!important;
height:auto!important;
margin-bottom:10px;
}

button{
padding:8px;
margin:5px;
border:none;
background:#4CAF50;
color:white;
border-radius:5px;
}

.dark{background:#121212;color:white;}
.dark .book{background:#1e1e1e;}

#login{text-align:center;margin-top:50px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>Login</h2>
<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<header>
📚 My Reading Zone  
<button onclick="toggleDark()">🌙</button>
</header>

<input id="search" placeholder="Search books..." onkeyup="searchBooks()">

<div id="bookList"></div>

<!-- READER -->
<div id="reader">
<button onclick="back()">⬅ Back</button>
<button onclick="savePage()">📌 Pin Page</button>
<h3 id="title"></h3>
<div id="content"></div>
</div>

<!-- ADMIN -->
<div id="admin" style="display:none;">
<h3>Add Book</h3>
<input id="t" placeholder="Title"><br>
<input type="file" id="pdf"><br>
<input type="file" id="img"><br>
<button onclick="add()">Add</button>
</div>

</div>

<script>

// ✅ LOGIN FIXED
function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === "admin" && p === "1234"){
    localStorage.setItem("login","true");
    start();
  } else {
    alert("Wrong username or password");
  }
}

function start(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("admin").style.display="block";
}

// AUTO LOGIN
if(localStorage.getItem("login") === "true"){
  start();
}

// 📚 YOUR BOOKS ONLY
let books=[
{title:"October Junction",cover:"Octoberjunction.jpg",pdf:"OctoberJunction.pdf"},
{title:"Deewar Mein Khidki",cover:"deewarmeekkhidki.jpg",pdf:"deewarmeekkhidki.pdf"},
{title:"Godaan",cover:"godaan.jpg",pdf:"godaan.pdf"}
];

// LOAD USER BOOKS
let saved=JSON.parse(localStorage.getItem("userBooks")||"[]");
books=[...books,...saved];

// SHOW BOOKS
function show(list=books){
  let container=document.getElementById("bookList");
  container.innerHTML="";

  list.forEach((b,i)=>{
    container.innerHTML+=`
    <div class="book" onclick="openBook(${i})">
      <img src="${b.cover}">
      <p>${b.title}</p>
    </div>`;
  });
}
show();

// 📖 OPEN BOOK
function openBook(i){
  let b=books[i];
  document.getElementById("title").innerText=b.title;
  let content=document.getElementById("content");
  content.innerHTML="Loading...";

  let task;

  if(b.pdf.startsWith("data:")){
    task = pdfjsLib.getDocument({data: atob(b.pdf.split(',')[1])});
  }else{
    task = pdfjsLib.getDocument(b.pdf);
  }

  task.promise.then(pdf=>{
    content.innerHTML="";

    for(let p=1;p<=pdf.numPages;p++){
      pdf.getPage(p).then(page=>{
        let viewport=page.getViewport({scale:1.3});
        let canvas=document.createElement("canvas");
        let ctx=canvas.getContext("2d");

        canvas.height=viewport.height;
        canvas.width=viewport.width;

        content.appendChild(canvas);

        page.render({canvasContext:ctx,viewport});
      });
    }

    // 📌 Restore page
    setTimeout(()=>{
      let pos=localStorage.getItem("page_"+i);
      if(pos) content.scrollTop=pos;
    },500);

  });

  document.getElementById("reader").style.display="block";
  document.getElementById("bookList").style.display="none";
}

// BACK
function back(){
  document.getElementById("reader").style.display="none";
  document.getElementById("bookList").style.display="flex";
}

// 📌 SAVE PAGE
function savePage(){
  let content=document.getElementById("content");
  let index=books.findIndex(b=>b.title===document.getElementById("title").innerText);
  localStorage.setItem("page_"+index,content.scrollTop);
  alert("Page pinned!");
}

// SEARCH
function searchBooks(){
  let v=document.getElementById("search").value.toLowerCase();
  show(books.filter(b=>b.title.toLowerCase().includes(v)));
}

// DARK MODE
function toggleDark(){
  document.body.classList.toggle("dark");
}

// ➕ ADD BOOK
function add(){
  let r1=new FileReader();
  let r2=new FileReader();

  r1.onload=()=>{
    r2.onload=()=>{

      let newBook={
        title:document.getElementById("t").value,
        pdf:r1.result,
        cover:r2.result
      };

      let arr=JSON.parse(localStorage.getItem("userBooks")||"[]");
      arr.push(newBook);
      localStorage.setItem("userBooks",JSON.stringify(arr));

      books.push(newBook);
      show();

      alert("Book Added!");
    };
    r2.readAsDataURL(document.getElementById("img").files[0]);
  };
  r1.readAsDataURL(document.getElementById("pdf").files[0]);
}

</script>

</body>
</html>
