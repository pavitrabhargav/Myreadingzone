<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Book App</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5;}
header{background:#4CAF50;color:#fff;padding:10px;text-align:center;}

#bookList{display:flex;flex-wrap:wrap;justify-content:center;}

.book{
width:140px;
margin:10px;
padding:10px;
background:#fff;
border-radius:10px;
text-align:center;
cursor:pointer;
}

.book img{width:100%;border-radius:8px;}

#reader{display:none;}
#content{height:80vh;overflow:auto;}

canvas{
width:100%!important;
height:auto!important;
margin-bottom:10px;
}

button{
padding:8px;
margin:5px;
background:#4CAF50;
color:white;
border:none;
border-radius:5px;
}

.dark{background:#121212;color:white;}
.dark .book{background:#1e1e1e;}

#login{text-align:center;margin-top:60px;}
#uploadBox{text-align:center;padding:10px;background:#fff;margin:10px;border-radius:10px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>Login</h2>
<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<header>
📚 My Library
<button onclick="toggleDark()">🌙</button>
</header>

<input id="search" placeholder="Search..." onkeyup="searchBooks()">

<!-- USER UPLOAD -->
<div id="uploadBox">
<h3>Upload Your Book</h3>
<input type="text" id="titleInput" placeholder="Book Title"><br>
<input type="file" id="pdfInput" accept="application/pdf"><br>
<input type="file" id="imgInput" accept="image/*"><br>
<button onclick="uploadBook()">Upload Book</button>
</div>

<div id="bookList"></div>

<!-- READER -->
<div id="reader">
<button onclick="goBack()">⬅ Back</button>
<button onclick="savePage()">📌 Pin</button>
<h3 id="bookTitle"></h3>
<div id="content"></div>
</div>

</div>

<script>

// LOGIN
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="admin" && p==="1234"){
localStorage.setItem("login","true");
start();
}else{
alert("Wrong Login");
}
}

function start(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
}

if(localStorage.getItem("login")==="true") start();

// 📚 YOUR BOOKS ONLY
let books=[
{title:"October Junction",cover:"Octoberjunction.jpg",pdf:"OctoberJunction.pdf"},
{title:"Deewar Mein Khidki",cover:"deewarmeekkhidki.jpg",pdf:"deewarmeekkhidki.pdf"},
{title:"Godaan",cover:"godaan.jpg",pdf:"godaan.pdf"}
];

// LOAD USER BOOKS
let userBooks=JSON.parse(localStorage.getItem("userBooks")||"[]");
books=[...books,...userBooks];

// SHOW BOOKS
function showBooks(list=books){
let box=document.getElementById("bookList");
box.innerHTML="";

list.forEach((b,i)=>{
box.innerHTML+=`
<div class="book" onclick="openBook(${i})">
<img src="${b.cover}">
<p>${b.title}</p>
</div>`;
});
}
showBooks();

// OPEN BOOK
function openBook(i){
let b=books[i];
document.getElementById("bookTitle").innerText=b.title;

let content=document.getElementById("content");
content.innerHTML="Loading...";

pdfjsLib.getDocument(b.pdf).promise.then(pdf=>{
content.innerHTML="";

for(let p=1;p<=pdf.numPages;p++){
pdf.getPage(p).then(page=>{
let viewport=page.getViewport({scale:1.4});
let canvas=document.createElement("canvas");
let ctx=canvas.getContext("2d");

canvas.height=viewport.height;
canvas.width=viewport.width;

content.appendChild(canvas);

page.render({canvasContext:ctx,viewport});
});
}

// restore scroll
setTimeout(()=>{
let pos=localStorage.getItem("page_"+i);
if(pos) content.scrollTop=pos;
},500);

});

document.getElementById("reader").style.display="block";
document.getElementById("bookList").style.display="none";
}

// BACK
function goBack(){
document.getElementById("reader").style.display="none";
document.getElementById("bookList").style.display="flex";
}

// 📌 PIN PAGE
function savePage(){
let pos=document.getElementById("content").scrollTop;
let title=document.getElementById("bookTitle").innerText;

let index=books.findIndex(b=>b.title===title);
localStorage.setItem("page_"+index,pos);

alert("Page Saved!");
}

// SEARCH
function searchBooks(){
let val=document.getElementById("search").value.toLowerCase();
showBooks(books.filter(b=>b.title.toLowerCase().includes(val)));
}

// DARK MODE
function toggleDark(){
document.body.classList.toggle("dark");
}

// USER UPLOAD
function uploadBook(){

let title=document.getElementById("titleInput").value;
let pdfFile=document.getElementById("pdfInput").files[0];
let imgFile=document.getElementById("imgInput").files[0];

let r1=new FileReader();
let r2=new FileReader();

r1.onload=function(){
r2.onload=function(){

let newBook={
title:title,
pdf:r1.result,
cover:r2.result
};

let arr=JSON.parse(localStorage.getItem("userBooks")||"[]");
arr.push(newBook);
localStorage.setItem("userBooks",JSON.stringify(arr));

books.push(newBook);
showBooks();

alert("Book Uploaded!");
};
r2.readAsDataURL(imgFile);
};

r1.readAsDataURL(pdfFile);

}

</script>

</body>
</html>
