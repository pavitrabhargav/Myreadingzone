<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reading Zone</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f5f5f5;
}

header{
  background:#4CAF50;
  color:white;
  padding:10px;
  text-align:center;
}

input,textarea{
  padding:8px;
  margin:5px;
  width:90%;
}

button{
  padding:8px;
  margin:5px;
  border:none;
  background:#4CAF50;
  color:white;
  border-radius:5px;
}

#bookList{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.book{
  width:140px;
  margin:10px;
  padding:10px;
  background:white;
  border-radius:10px;
  text-align:center;
}

.book img{
  width:100%;
}

#reader{
  display:none;
}

#content{
  height:80vh;
  overflow:auto;
}

/* MOBILE PDF FIX */
canvas{
  width:100% !important;
  height:auto !important;
}

/* DARK */
.dark{
  background:#121212;
  color:white;
}

.dark .book{
  background:#1e1e1e;
}

/* LOGIN */
#loginPage{
  text-align:center;
  margin-top:50px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <h2>Login</h2>
  <input id="username" placeholder="Username"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<header>
  <h2>📚 My Reading Zone</h2>
  <button onclick="toggleDark()">🌙</button>
</header>

<input id="search" placeholder="Search books..." onkeyup="searchBooks()">

<div id="bookList"></div>

<!-- READER -->
<div id="reader">
  <button onclick="goBack()">⬅ Back</button>
  <button onclick="saveBookmark()">🔖</button>
  <h3 id="title"></h3>
  <div id="content"></div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">
  <h3>Add Book</h3>
  <input id="bookTitle" placeholder="Title"><br>
  <input type="file" id="pdfFile"><br>
  <input type="file" id="imgFile"><br>
  <button onclick="addBook()">Add</button>
</div>

</div>

<script>

// LOGIN
function login(){
  if(username.value==="admin" && password.value==="1234"){
    localStorage.setItem("login","true");
    startApp();
  }else{
    alert("Wrong login");
  }
}

function startApp(){
  loginPage.style.display="none";
  app.style.display="block";
  adminPanel.style.display="block";
}

// AUTO LOGIN
if(localStorage.getItem("login")==="true"){
  startApp();
}

// BOOKS (DEFAULT)
let books=[
  {title:"October Junction",cover:"Octoberjunction.jpg",pdf:"OctoberJunction.pdf"},
  {title:"Godaan",cover:"godaan.jpg",pdf:"godaan.pdf"}
];

// LOAD SAVED
let saved=localStorage.getItem("books");
if(saved) books=JSON.parse(saved);

// SHOW BOOKS
function displayBooks(list=books){
  bookList.innerHTML="";
  list.forEach((b,i)=>{
    bookList.innerHTML+=`
    <div class="book" onclick="openBook(${i})">
      <img src="${b.cover}">
      <p>${b.title}</p>
    </div>`;
  });
}
displayBooks();

// OPEN PDF (MOBILE FIXED)
function openBook(i){
  let b=books[i];
  title.innerText=b.title;
  content.innerHTML="Loading...";

  let scale = window.innerWidth < 600 ? 1.5 : 1.2;

  pdfjsLib.getDocument(b.pdf).promise.then(pdf=>{
    content.innerHTML="";
    for(let p=1;p<=pdf.numPages;p++){
      pdf.getPage(p).then(page=>{
        let viewport=page.getViewport({scale:scale});
        let canvas=document.createElement("canvas");
        let ctx=canvas.getContext("2d");

        canvas.height=viewport.height;
        canvas.width=viewport.width;

        content.appendChild(canvas);

        page.render({canvasContext:ctx,viewport:viewport});
      });
    }
  });

  reader.style.display="block";
  bookList.style.display="none";
}

// BACK
function goBack(){
  reader.style.display="none";
  bookList.style.display="flex";
}

// SEARCH
function searchBooks(){
  let v=search.value.toLowerCase();
  displayBooks(books.filter(b=>b.title.toLowerCase().includes(v)));
}

// DARK
function toggleDark(){
  document.body.classList.toggle("dark");
}

// BOOKMARK
function saveBookmark(){
  localStorage.setItem("scroll",content.scrollTop);
  alert("Saved");
}

// ADD BOOK (USER UPLOAD)
function addBook(){
  let t=bookTitle.value;
  let pdf=pdfFile.files[0];
  let img=imgFile.files[0];

  let reader1=new FileReader();
  let reader2=new FileReader();

  reader1.onload=function(){
    reader2.onload=function(){
      books.push({
        title:t,
        pdf:reader1.result,
        cover:reader2.result
      });

      localStorage.setItem("books",JSON.stringify(books));
      displayBooks();
      alert("Book Added!");
    };
    reader2.readAsDataURL(img);
  };
  reader1.readAsDataURL(pdf);
}

</script>

</body>
</html>
