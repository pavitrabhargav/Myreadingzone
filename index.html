<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reading Zone</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5;}
header{background:#4CAF50;color:#fff;padding:10px;text-align:center;}

#bookList{display:flex;flex-wrap:wrap;justify-content:center;}

.book{
width:140px;
margin:10px;
background:#fff;
padding:10px;
border-radius:10px;
text-align:center;
}

.book img{width:100%;}

#reader{display:none;}
#content{height:80vh;overflow:auto;}

canvas{
width:100%!important;
height:auto!important;
margin-bottom:10px;
}

button{
padding:8px;
margin:5px;
border:none;
background:#4CAF50;
color:white;
border-radius:5px;
}

.dark{background:#121212;color:white;}
.dark .book{background:#1e1e1e;}

#login{text-align:center;margin-top:50px;}
</style>
</head>

<body>

<!-- LOGIN -->
function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === "admin" && p === "1234"){
    localStorage.setItem("login","true");
    start();
  } else {
    alert("Wrong username or password");
  }
}

<!-- APP -->
<div id="app" style="display:none;">

<header>
📚 My Reading Zone  
<button onclick="toggleDark()">🌙</button>
</header>

<input id="search" placeholder="Search" onkeyup="searchBooks()">

<div id="bookList"></div>

<!-- READER -->
<div id="reader">
<button onclick="back()">⬅ Back</button>
<button onclick="savePage()">📌 Pin Page</button>
<h3 id="title"></h3>
<div id="content"></div>
</div>

<!-- ADMIN -->
<div id="admin" style="display:none;">
<h3>Add Book</h3>
<input id="t" placeholder="Title"><br>
<input type="file" id="pdf"><br>
<input type="file" id="img"><br>
<button onclick="add()">Add</button>
</div>

</div>

<script>

// LOGIN
function login(){
if(user.value==="admin" && pass.value==="1234"){
localStorage.setItem("login",1);
start();
}else alert("Wrong login");
}

function start(){
login.style.display="none";
app.style.display="block";
admin.style.display="block";
}

if(localStorage.getItem("login")) start();

// 📚 ONLY YOUR BOOKS
let books=[
{title:"October Junction",cover:"Octoberjunction.jpg",pdf:"OctoberJunction.pdf"},
{title:"Deewar Mein Khidki",cover:"deewarmeekkhidki.jpg",pdf:"deewarmeekkhidki.pdf"},
{title:"Godaan",cover:"godaan.jpg",pdf:"godaan.pdf"}
];

// LOAD USER BOOKS
let saved=JSON.parse(localStorage.getItem("userBooks")||"[]");
books=[...books,...saved];

// SHOW BOOKS
function show(list=books){
bookList.innerHTML="";
list.forEach((b,i)=>{
bookList.innerHTML+=`
<div class="book" onclick="openBook(${i})">
<img src="${b.cover}">
<p>${b.title}</p>
</div>`;
});
}
show();

// OPEN BOOK (MOBILE FRIENDLY)
function openBook(i){
let b=books[i];
title.innerText=b.title;
content.innerHTML="Loading...";

let loadingTask;

if(b.pdf.startsWith("data:")){
loadingTask=pdfjsLib.getDocument({data:atob(b.pdf.split(',')[1])});
}else{
loadingTask=pdfjsLib.getDocument(b.pdf);
}

loadingTask.promise.then(pdf=>{
content.innerHTML="";

for(let p=1;p<=pdf.numPages;p++){
pdf.getPage(p).then(page=>{
let viewport=page.getViewport({scale:1.3});
let canvas=document.createElement("canvas");
let ctx=canvas.getContext("2d");

canvas.height=viewport.height;
canvas.width=viewport.width;

content.appendChild(canvas);

page.render({canvasContext:ctx,viewport});
});
}

// 📌 Restore pinned scroll
setTimeout(()=>{
let pos=localStorage.getItem("page_"+i);
if(pos) content.scrollTop=pos;
},500);

});

reader.style.display="block";
bookList.style.display="none";
}

// BACK
function back(){
reader.style.display="none";
bookList.style.display="flex";
}

// 📌 SAVE PAGE
function savePage(){
let index=books.findIndex(b=>b.title===title.innerText);
localStorage.setItem("page_"+index,content.scrollTop);
alert("Page pinned!");
}

// SEARCH
function searchBooks(){
let v=search.value.toLowerCase();
show(books.filter(b=>b.title.toLowerCase().includes(v)));
}

// DARK MODE
function toggleDark(){
document.body.classList.toggle("dark");
}

// ADD BOOK
function add(){
let r1=new FileReader();
let r2=new FileReader();

r1.onload=()=>{
r2.onload=()=>{

let newBook={
title:t.value,
pdf:r1.result,
cover:r2.result
};

let arr=JSON.parse(localStorage.getItem("userBooks")||"[]");
arr.push(newBook);
localStorage.setItem("userBooks",JSON.stringify(arr));

books.push(newBook);
show();

alert("Book Added!");
};

r2.readAsDataURL(img.files[0]);
};

r1.readAsDataURL(pdf.files[0]);
}

</script>

</body>
</html>
