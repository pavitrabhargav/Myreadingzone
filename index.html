<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Reader App</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f5f5f5;
  color:#333;
}

header{
  background:#4CAF50;
  color:white;
  padding:10px;
  text-align:center;
}

input, textarea{
  padding:8px;
  margin:5px;
  width:90%;
}

button{
  padding:8px;
  margin:5px;
  cursor:pointer;
}

#bookList{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.book{
  width:140px;
  margin:10px;
  padding:10px;
  background:white;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
}

.book img{
  width:100%;
  border-radius:8px;
}

#reader{
  display:none;
  padding:10px;
}

#content{
  height:75vh;
  overflow-y:auto;
  line-height:1.6;
}

.dark{
  background:#121212;
  color:white;
}

.dark .book{
  background:#1e1e1e;
}

#loginPage{
  text-align:center;
  margin-top:50px;
}

#adminPanel{
  display:none;
  padding:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <h2>Login</h2>
  <input id="username" placeholder="Username"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">

<header>
  <h2>📚 My Book App</h2>
  <button onclick="toggleDark()">🌙 Dark</button>
</header>

<input id="search" placeholder="Search books..." onkeyup="searchBooks()">
<input type="file" id="pdfUpload" accept="application/pdf">

<div id="bookList"></div>

<!-- READER -->
<div id="reader">
  <button onclick="goBack()">⬅ Back</button>
  <button onclick="saveBookmark()">🔖 Bookmark</button>
  <h2 id="title"></h2>
  <div id="content"></div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <h3>Add Book</h3>
  <input id="bookTitle" placeholder="Book Title"><br>
  <textarea id="bookContent" placeholder="Book Content"></textarea><br>
  <button onclick="addBook()">Add Book</button>
</div>

</div>

<script>

// LOGIN
function login(){
  let user="admin";
  let pass="1234";

  if(document.getElementById("username").value===user &&
     document.getElementById("password").value===pass){
    localStorage.setItem("login","true");
    startApp();
  }else{
    alert("Wrong login");
  }
}

function startApp(){
  document.getElementById("loginPage").style.display="none";
  document.getElementById("app").style.display="block";
}

// AUTO LOGIN
if(localStorage.getItem("login")==="true"){
  startApp();
}

// BOOK DATA
let books=[
  {title:"Story 1", cover:"https://via.placeholder.com/150", content:"This is sample book 1. ".repeat(50)},
  {title:"Story 2", cover:"https://via.placeholder.com/150", content:"This is sample book 2. ".repeat(50)},
  {title:"Story 3", cover:"https://via.placeholder.com/150", content:"This is sample book 3. ".repeat(50)},
  {title:"Story 4", cover:"https://via.placeholder.com/150", content:"This is sample book 4. ".repeat(50)},
  {title:"Story 5", cover:"https://via.placeholder.com/150", content:"This is sample book 5. ".repeat(50)}
];

// LOAD SAVED BOOKS
let saved=localStorage.getItem("books");
if(saved){
  books=JSON.parse(saved);
}

// DISPLAY BOOKS
function displayBooks(){
  let list=document.getElementById("bookList");
  list.innerHTML="";

  books.forEach((b,i)=>{
    list.innerHTML+=`
    <div class="book" onclick="openBook(${i})">
      <img src="${b.cover}">
      <p>${b.title}</p>
    </div>`;
  });
}
displayBooks();

// OPEN BOOK
function openBook(i){
  let book=books[i];

  document.getElementById("title").innerText=book.title;
  let content=document.getElementById("content");
  content.innerText=book.content;

  // restore bookmark
  let pos=localStorage.getItem("bookmark_"+i);
  setTimeout(()=>{content.scrollTop=pos||0},100);

  document.getElementById("reader").style.display="block";
  document.getElementById("bookList").style.display="none";
}

// BACK
function goBack(){
  document.getElementById("reader").style.display="none";
  document.getElementById("bookList").style.display="flex";
}

// SEARCH
function searchBooks(){
  let val=document.getElementById("search").value.toLowerCase();
  let filtered=books.filter(b=>b.title.toLowerCase().includes(val));

  let list=document.getElementById("bookList");
  list.innerHTML="";

  filtered.forEach((b,i)=>{
    list.innerHTML+=`
    <div class="book" onclick="openBook(${i})">
      <img src="${b.cover}">
      <p>${b.title}</p>
    </div>`;
  });
}

// DARK MODE
function toggleDark(){
  document.body.classList.toggle("dark");
}

// BOOKMARK
function saveBookmark(){
  let pos=document.getElementById("content").scrollTop;
  let title=document.getElementById("title").innerText;

  let index=books.findIndex(b=>b.title===title);
  localStorage.setItem("bookmark_"+index,pos);

  alert("Bookmark saved!");
}

// ADD BOOK
function addBook(){
  let t=document.getElementById("bookTitle").value;
  let c=document.getElementById("bookContent").value;

  books.push({
    title:t,
    cover:"https://via.placeholder.com/150",
    content:c
  });

  localStorage.setItem("books",JSON.stringify(books));
  displayBooks();
}

// SHOW ADMIN PANEL (only admin)
if(localStorage.getItem("login")==="true"){
  document.getElementById("adminPanel").style.display="block";
}

// PDF READER
document.getElementById("pdfUpload").addEventListener("change", function(e){
  let file=e.target.files[0];
  let reader=new FileReader();

  reader.onload=function(){
    let typedarray=new Uint8Array(this.result);

    pdfjsLib.getDocument(typedarray).promise.then(function(pdf){
      let content=document.getElementById("content");
      content.innerHTML="";

      for(let i=1;i<=pdf.numPages;i++){
        pdf.getPage(i).then(function(page){
          let viewport=page.getViewport({scale:1.2});
          let canvas=document.createElement("canvas");
          let ctx=canvas.getContext("2d");

          canvas.height=viewport.height;
          canvas.width=viewport.width;

          content.appendChild(canvas);

          page.render({
            canvasContext:ctx,
            viewport:viewport
          });
        });
      }

      document.getElementById("reader").style.display="block";
      document.getElementById("bookList").style.display="none";
    });
  };

  reader.readAsArrayBuffer(file);
});

</script>

</body>
  </html>
